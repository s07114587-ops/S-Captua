<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="S-Captcha by Shubhomoy - The ultimate free, open-source, and zero-database smart captcha security system. Protect your website instantly with a single line of code!">
    
    <!-- Favicon -->
    <link rel="icon" href="111.ico" type="image/x-icon">
    
    <title>S-Captcha | Security Portal</title>

    <!-- Clerk JS SDK -->
    <script
        async
        crossorigin="anonymous"
        data-clerk-publishable-key="pk_test_Z...RzLmR1diQ"
        src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
        type="text/javascript"
    ></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #1a202c; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Header & Logo */
        header { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ec4899; background: #0f172a; }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: bold; color: #f97316; }
        .logo img { height: 40px; }

        /* Main Area */
        main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: #1e293b; padding: 40px; border-radius: 15px; text-align: center; max-width: 550px; width: 100%; border: 2px solid #ef4444; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        
        /* Buttons */
        .btn { background: linear-gradient(135deg, #ef4444, #f97316); color: white; border: none; padding: 12px 25px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 20px; transition: 0.2s; }
        .btn:hover { transform: scale(1.03); }
        .btn-green { background: linear-gradient(135deg, #10b981, #22c55e); }

        /* Instructions */
        .instruction-box { background: #000; padding: 15px; border-radius: 8px; text-align: left; margin: 20px 0; color: #22c55e; font-family: monospace; font-size: 14px; overflow-x: auto; border: 1px solid #ec4899; }
        
        /* Footer */
        footer { padding: 20px; text-align: center; border-top: 2px solid #22c55e; background: #0f172a; }
        footer a { color: #cbd5e1; margin: 0 15px; text-decoration: none; font-size: 14px; }
        footer a:hover { color: #ec4899; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <img src="111.png" alt="Logo" onerror="this.src='111.ico'"> S-Captcha
        </div>
        <div id="user-button"></div>
    </header>

    <main>
        <div class="card" id="main-card">
            <!-- Loading message while Clerk initializes -->
            <p style="color: #cbd5e1;">Loading S-Captcha Portal...</p>
        </div>
    </main>

    <footer>
        <a href="https://www.scaptua.duckdns.org/about.html" target="_blank">About</a>
        <a href="https://www.scaptua.duckdns.org/terms.html" target="_blank">Terms</a>
        <a href="https://www.scaptua.duckdns.org/privacy.html" target="_blank">Privacy</a>
    </footer>

    <script>
        window.addEventListener('load', async function () {
            // Clerk ইনিশিয়ালাইজ হওয়া পর্যন্ত ওয়েট করবে
            let checkClerk = setInterval(async () => {
                if (window.Clerk) {
                    clearInterval(checkClerk);
                    await window.Clerk.load();

                    const mainCard = document.getElementById('main-card');
                    const userBtnDiv = document.getElementById('user-button');

                    if (window.Clerk.user) {
                        // ইউজার লগইন থাকলে এই HTML দেখাবে
                        mainCard.innerHTML = `
                            <h1 style="color: #22c55e;">Welcome, ${window.Clerk.user.firstName || 'Developer'}! 😎</h1>
                            <p style="color: #cbd5e1; margin-top: 10px;">How to use S-Captcha in your website:</p>
                            <div class="instruction-box">
                                &lt;script src="https://www.scaptua.duckdns.org/widget.js" async defer&gt;&lt;/script&gt;
                            </div>
                            <a href="https://www.dashboard.scaptua.duckdns.org/" class="btn btn-green">Go to Dashboard</a>
                        `;
                        window.Clerk.mountUserButton(userBtnDiv);
                    } else {
                        // ইউজার লগইন না থাকলে এই বাটন দেখাবে
                        mainCard.innerHTML = `
                            <h1 style="color: #f97316; margin-bottom: 15px;">S-Captcha Login</h1>
                            <p style="color: #cbd5e1;">Zero-database smart security for your apps.</p>
                            <button class="btn" id="login-btn">Login / Sign Up</button>
                        `;

                        document.getElementById('login-btn').addEventListener('click', () => {
                            window.Clerk.openSignIn();
                        });
                    }
                }
            }, 100);
        });
    </script>
</body>
</html>
