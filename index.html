<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="S-Captcha by Shubhomoy - The ultimate free, open-source, and zero-database smart captcha security system. Protect your website instantly with a single line of code!">
    
    <!-- Favicon -->
    <link rel="icon" href="111.ico" type="image/x-icon">
    
    <title>S-Captcha | Security Portal</title>

    <!-- Clerk JS SDK -->
    <script
        async
        crossorigin="anonymous"
        data-clerk-publishable-key="YOUR_API1_KEY_HERE"
        src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
        type="text/javascript"
    ></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #1a202c; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Header & Logo */
        header { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ec4899; }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: bold; color: #f97316; }
        .logo img { height: 40px; }

        /* Main Area */
        main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: #1e293b; padding: 40px; border-radius: 15px; text-align: center; max-width: 500px; width: 100%; border: 1px solid #ef4444; }
        
        /* Buttons */
        .btn { background: #ef4444; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 20px; }
        .btn-green { background: #22c55e; }

        /* Instructions */
        #auth-view { display: none; } /* Hide by default */
        .instruction-box { background: #000; padding: 15px; border-radius: 8px; text-align: left; margin: 20px 0; color: #22c55e; font-family: monospace; }
        
        /* Footer */
        footer { padding: 20px; text-align: center; border-top: 1px solid #22c55e; }
        footer a { color: #cbd5e1; margin: 0 10px; text-decoration: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <img src="111.png" alt="Logo"> S-Captcha
        </div>
        <div id="user-button"></div>
    </header>

    <main>
        <div class="card">
            <!-- Login View -->
            <div id="unauth-view">
                <h1 style="color: #f97316;">S-Captcha Login</h1>
                <button class="btn" id="login-btn">Login / Sign Up</button>
            </div>

            <!-- After Login View -->
            <div id="auth-view">
                <h1 style="color: #22c55e;">Welcome Developer!</h1>
                <p>Copy this widget script:</p>
                <div class="instruction-box">
                    &lt;script src="https://www.scaptua.duckdns.org/widget.js" async defer&gt;&lt;/script&gt;
                </div>
                <a href="https://www.dashboard.scaptua.duckdns.org/" class="btn btn-green">Go to Dashboard</a>
            </div>
        </div>
    </main>

    <footer>
        <a href="https://www.scaptua.duckdns.org/about.html">About</a>
        <a href="https://www.scaptua.duckdns.org/terms.html">Terms</a>
        <a href="https://www.scaptua.duckdns.org/privacy.html">Privacy</a>
    </footer>

    <script>
        window.addEventListener('load', async function () {
            await Clerk.load();
            const unauth = document.getElementById('unauth-view');
            const auth = document.getElementById('auth-view');
            const userBtnDiv = document.getElementById('user-button');

            if (Clerk.user) {
                auth.style.display = 'block'; // Show if logged in
                unauth.style.display = 'none';
                Clerk.mountUserButton(userBtnDiv);
            } else {
                unauth.style.display = 'block'; // Show if NOT logged in
                document.getElementById('login-btn').onclick = () => Clerk.openSignIn();
            }
        });
    </script>
</body>
</html>
