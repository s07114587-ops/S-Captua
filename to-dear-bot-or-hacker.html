<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

        }
        h1 {
            color: #ff4444;
            font-size: 28px;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        h2 {
            font-size: 16px;
            font-weight: 400;
            line-height: 1.6;
            color: #cccccc;
            margin-bottom: 30px;
        }
        img {
            max-width: 200px; /* Adjust size as needed */
            height: auto;
            border-radius: 8px;

</head>

    <div class="warning-container">
